# TEMPORARY diagnostic (PHASE L): one WebKit journey on Linux. Not for merge.
name: diag-webkit
on:
  pull_request:
    branches: ["main"]
    paths: [".github/workflows/diag-webkit.yml", "e2e/diag-l.spec.ts", "playwright.config.ts"]
jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        code: [current]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - if: matrix.code == 'phase-i-f862f29'
        run: git checkout f862f29 -- src index.html works.html works archive.html vite.config.ts public
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx vite build
      - run: npx playwright install --with-deps webkit
      - run: DEBUG=pw:browser npx playwright test e2e/diag-l.spec.ts --project=webkit -g "the room|less motion" --repeat-each=3 --reporter=list > diag.txt 2>&1 || true
      - run: grep -E "GARAGE|PLAYGROUND|BACK|CRASH|passed|failed" diag.txt | cut -c1-300; echo ----; grep -iE "crash|abort|assert|signal|oom|out of memory|SIGSEGV|SIGKILL|segmentation|killed|ERROR" diag.txt | grep -v "Error Context" | sort | uniq -c | sort -rn | head -40
