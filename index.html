<!doctype html>
<html lang="ko">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#04050a">
<link rel="icon" href="/assets/images/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">

<!-- The entrance is the first thing on screen, so its plate is fetched before
     the module that arranges it. One per orientation, matching the <picture>
     below exactly; the browser downloads only the one it will use. -->
<link rel="preload" as="image" href="/assets/images/alley/alley_base_desktop.webp"
      type="image/webp" media="(orientation:landscape)" fetchpriority="high">
<link rel="preload" as="image" href="/assets/images/alley/alley_base_mobile.webp"
      type="image/webp" media="(orientation:portrait)" fetchpriority="high">
<link rel="preload" as="image" href="/assets/images/alley/alley_shutter.webp"
      type="image/webp" fetchpriority="high">
<script type="module" src="/src/main.ts"></script>
<meta property="og:type" content="website">
<meta property="og:image" content="https://eungarage.com/assets/images/og-image.jpg">
<link rel="canonical" href="https://eungarage.com/">
<meta property="og:url" content="https://eungarage.com/">
<meta property="og:site_name" content="EUNGARAGE">
<meta name="twitter:card" content="summary_large_image">

<title>EUNGARAGE — Worlds Beyond the Ordinary</title>
<meta name="description" content="EUNGARAGE는 감정, 캐릭터, 독특한 세계가 오래 기억되는 게임을 만듭니다. LUNAI, LIMINAL, WORM UP!">
<meta property="og:title" content="EUNGARAGE">
<meta property="og:description" content="Emotion. Character. Worlds beyond the ordinary.">
</head>
<body class="loading page-cozy page-garage">

<div class="noise"></div>
<nav class="site-nav">
  <div class="container nav-inner">
    <a class="brand" href="./index.html" aria-label="EUNGARAGE home">
      <span class="brand-wordmark brand-word">EUNGARAGE</span>
    </a>
    <div class="nav-links">
      <a href="./games.html">Games</a>
      <a href="./studio.html">Studio</a>
      <a href="./support.html">Support</a>
      <a href="./studio.html#contact">Contact</a>
    </div>
    <button class="menu-toggle" aria-label="메뉴 열기"><span></span><span></span></button>
  </div>
</nav>

<main>
  <!-- Korean alley entrance. One shutter, one way in. -->
  <section class="alley" id="top" data-alley aria-labelledby="alleyHeading">
    <h1 id="alleyHeading" class="visually-hidden">EUNGARAGE — 골목 안쪽의 작은 게임 작업실</h1>

    <div class="alley__stage" aria-hidden="true">
      <!-- The plate is the box the base image really occupies once cover has
           been applied. The scene sizes it, and every layer above sits at a
           percentage of it, so the shutter stays in its painted doorway. -->
      <div class="alley__plate" data-alley-plate>
        <picture>
          <source media="(orientation:portrait)"
                  srcset="/assets/images/alley/alley_base_mobile.webp"
                  width="1170" height="2080">
          <img class="alley__base" data-alley-base
               src="/assets/images/alley/alley_base_desktop.webp"
               width="2560" height="1440" alt="" fetchpriority="high" decoding="async">
        </picture>

        <!-- Everything staged in the doorway: the light that spills out, the
             shadow that crosses it, and the wash we push through into. -->
        <span class="alley__glow" data-alley-doorway></span>
        <!-- What the open door shows before you are through it: a little
             dust in the light, and somebody looking round the frame. -->
        <div class="alley__doorway" data-alley-doorway aria-hidden="true">
          <span class="alley__dust"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
          <span class="alley__peek" data-alley-peek>
            <img src="/assets/images/dokkaebi/momo/idle/front/momo_idle_front_01.webp"
                 width="298" height="420" alt="" decoding="async" loading="lazy">
          </span>
        </div>

        <!-- A roll shutter: the housing at the top stays, the slats below it
             roll up into it. Both are slices of the same image. -->
        <div class="alley__cutout alley__shutter" data-alley-layer="shutter">
          <div class="alley__slats-clip">
            <img class="alley__slats" data-alley-shutter-img
                 src="/assets/images/alley/alley_shutter.webp"
                 width="1100" height="1211" alt="" fetchpriority="high" decoding="async">
          </div>
          <img class="alley__drum" src="/assets/images/alley/alley_shutter.webp"
               width="1100" height="1211" alt="" fetchpriority="high" decoding="async">
        </div>
        <img class="alley__cutout alley__sign" data-alley-layer="sign"
             src="/assets/images/alley/alley_sign.webp"
             width="760" height="481" alt="" decoding="async">

        <!-- What a studio that works late leaves outside: the week's parcels
             on one side of the door, the shopping on the other. Ordered back
             to front; placement is in src/data/alley.ts. -->
        <img class="alley__cutout alley__prop" data-alley-prop="parcelStack"
             src="/assets/images/alley/alley_prop_parcel_stack.webp"
             width="496" height="491" alt="" fetchpriority="low" decoding="async">
        <img class="alley__cutout alley__prop" data-alley-prop="zeroCola"
             src="/assets/images/alley/alley_prop_zero_cola.webp"
             width="449" height="480" alt="" fetchpriority="low" decoding="async">
        <img class="alley__cutout alley__prop" data-alley-prop="packetRamen"
             src="/assets/images/alley/alley_prop_packet_ramen.webp"
             width="335" height="432" alt="" fetchpriority="low" decoding="async">
        <img class="alley__cutout alley__prop" data-alley-prop="bag"
             src="/assets/images/alley/alley_prop_bag.webp"
             width="352" height="449" alt="" fetchpriority="low" decoding="async">
        <img class="alley__cutout alley__prop" data-alley-prop="eggs"
             src="/assets/images/alley/alley_prop_eggs.webp"
             width="448" height="287" alt="" fetchpriority="low" decoding="async">
        <img class="alley__cutout alley__prop" data-alley-prop="waterPack"
             src="/assets/images/alley/alley_prop_water_pack.webp"
             width="386" height="483" alt="" fetchpriority="low" decoding="async">
        <img class="alley__cutout alley__prop" data-alley-prop="cupRamen"
             src="/assets/images/alley/alley_prop_cup_ramen.webp"
             width="408" height="442" alt="" fetchpriority="low" decoding="async">

        <span class="alley__lamp" data-alley-lamp></span>
      </div>
    </div>
    <!-- Where the camera lands: warm interior. STEP 3's garage takes over here. -->
    <div class="alley__inside" aria-hidden="true"></div>

    <button class="alley__enter" type="button" data-alley-enter>
      <span class="alley__enter-dot" aria-hidden="true"></span>
      ENTER
    </button>
  </section>

  <!-- The garage: a room larger than the window. Furniture, hit areas and the
       crew all live in one world coordinate space (src/data/world.ts); the
       camera moves inside it. Built by the scene, so this is just the frame. -->
  <section class="garage" id="garage" data-garage hidden aria-label="EUNGARAGE 작업실">
    <div class="garage__stage" data-garage-stage>
      <div class="garage__room" data-garage-room></div>
      <!-- Kept for when the crew come back; nothing is put in it now. -->
      <div class="garage__crew" data-garage-crew hidden></div>
    </div>
  </section>
  <div data-panel-root hidden></div>
  <div data-game-root hidden></div>

  <!-- The long landing page that used to sit under the entrance has moved to
       games.html and studio.html. Nothing below the shutter: a visitor who
       scrolls instead of entering must not find a second version of the site.
       These links keep every page reachable without JavaScript, for crawlers
       and for store review. -->
  <nav class="visually-hidden" aria-label="EUNGARAGE 페이지">
    <a href="./games.html">Games</a>
    <a href="./studio.html">Studio</a>
    <a href="./support.html">Support</a>
    <a href="./privacy.html">Privacy</a>
    <a href="./terms.html">Terms</a>
    <a href="./community-guidelines.html">Community guidelines</a>
    <a href="./account-deletion.html">Account deletion</a>
    <a href="mailto:eungarage@gmail.com">eungarage@gmail.com</a>
  </nav>
</main>


</body></html>
